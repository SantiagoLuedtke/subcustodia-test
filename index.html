<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subcustodia · Seguimiento de pruebas SWIFT</title>
<style>
  :root{
    --bg: #F4F5F7;
    --panel: #FFFFFF;
    --ink: #1B2430;
    --ink-soft: #5B6472;
    --line: #DDE1E7;
    --brand: #17475A;
    --brand-soft: #E7EEF0;
    --ok: #2F9E5B;
    --ok-bg: #E5F5EC;
    --error: #C0392B;
    --error-bg: #FBEAE8;
    --pend: #C6821C;
    --pend-bg: #FBF1E1;
    --prog: #2E5FA3;
    --prog-bg: #E8EFF9;
    --block: #6B7280;
    --block-bg: #ECEDEF;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--sans); font-size:14px; line-height:1.45;
  }
  .app{ display:flex; min-height:100vh; }

  /* Sidebar */
  .sidebar{
    width:220px; flex-shrink:0; background:var(--brand); color:#fff;
    padding:24px 0; display:flex; flex-direction:column; gap:2px;
  }
  .brand{
    padding:0 20px 20px 20px; font-size:15px; font-weight:600; letter-spacing:0.2px;
    border-bottom:1px solid rgba(255,255,255,0.15); margin-bottom:12px;
  }
  .brand small{ display:block; font-weight:400; color:rgba(255,255,255,0.65); font-size:12px; margin-top:2px;}
  .nav-btn{
    background:none; border:none; color:rgba(255,255,255,0.78); text-align:left;
    padding:10px 20px; font-size:13.5px; cursor:pointer; font-family:var(--sans);
    border-left:3px solid transparent;
  }
  .nav-btn:hover{ background:rgba(255,255,255,0.06); color:#fff; }
  .nav-btn.active{ background:rgba(255,255,255,0.1); color:#fff; border-left-color:#7FB2C4; font-weight:600; }
  #conn-status{
    margin-top:auto; padding:14px 20px; font-size:11px; color:rgba(255,255,255,0.55);
    border-top:1px solid rgba(255,255,255,0.15);
  }

  /* Main */
  .main{ flex:1; padding:28px 32px; overflow-x:hidden; }
  .page-title{ font-size:20px; font-weight:700; margin:0 0 4px 0; }
  .page-sub{ color:var(--ink-soft); margin:0 0 20px 0; font-size:13px; }

  .event-tabs{ display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
  .event-tab{
    padding:7px 13px; border-radius:6px; border:1px solid var(--line); background:var(--panel);
    color:var(--ink-soft); font-size:12.5px; cursor:pointer; font-family:var(--sans);
  }
  .event-tab.active{ background:var(--brand); color:#fff; border-color:var(--brand); }

  /* Cards / Dashboard */
  .cards-row{ display:flex; gap:12px; margin-bottom:22px; flex-wrap:wrap; }
  .stat-card{
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:14px 18px; min-width:110px; flex:1;
  }
  .stat-num{ font-size:24px; font-weight:700; font-family:var(--mono); }
  .stat-label{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }

  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:18px 20px; margin-bottom:20px;
  }
  .panel h3{ margin:0 0 14px 0; font-size:14px; font-weight:700; }

  .progress-row{ display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .progress-label{ width:230px; flex-shrink:0; font-size:12.5px; }
  .progress-track{ flex:1; height:10px; background:var(--brand-soft); border-radius:5px; overflow:hidden; display:flex;}
  .progress-fill{ height:100%; }
  .progress-pct{ width:70px; text-align:right; font-family:var(--mono); font-size:12px; color:var(--ink-soft); flex-shrink:0;}

  /* Table */
  .table-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:8px; background:var(--panel); }
  table{ border-collapse:collapse; width:100%; min-width:1500px; font-size:12.5px; }
  thead th{
    background:#F0F2F5; text-align:left; padding:9px 10px; border-bottom:2px solid var(--line);
    white-space:nowrap; font-size:11.5px; color:var(--ink-soft); font-weight:700; position:sticky; top:0; z-index:2;
  }
  tbody td{ padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tbody tr:hover{ background:#FAFBFC; }
  td.id-col, th.id-col{ position:sticky; left:0; background:#F0F2F5; z-index:1; font-family:var(--mono); font-weight:700; }
  tbody td.id-col{ background:var(--panel); }
  tbody tr:hover td.id-col{ background:#FAFBFC; }

  input[type=text], input[type=date], select, textarea{
    font-family:var(--sans); font-size:12.5px; border:1px solid transparent; background:transparent;
    padding:4px 5px; border-radius:4px; width:100%; color:var(--ink);
  }
  input[type=text]:hover, input[type=date]:hover, select:hover, textarea:hover{ border-color:var(--line); }
  input[type=text]:focus, input[type=date]:focus, select:focus, textarea:focus{
    outline:none; border-color:var(--brand); background:#fff;
  }
  select{ cursor:pointer; }

  .status-select{ font-weight:600; border-radius:5px; padding:5px 6px; }
  .st-Pendiente{ background:var(--pend-bg); color:var(--pend); }
  .st-OK{ background:var(--ok-bg); color:var(--ok); }
  .st-ErrorMensaje{ background:var(--error-bg); color:var(--error); }
  .st-ErrorSistema{ background:var(--prog-bg); color:var(--prog); }

  .badge{ font-size:10.5px; padding:2px 6px; border-radius:4px; font-weight:600; white-space:nowrap; }
  .badge-inmediato{ background:#FBEAE8; color:#B14A3A; }
  .badge-futuro{ background:#E8EFF9; color:#2E5FA3; }

  .btn{
    border:1px solid var(--line); background:var(--panel); color:var(--ink);
    padding:7px 14px; border-radius:6px; cursor:pointer; font-size:12.5px; font-family:var(--sans);
  }
  .btn:hover{ background:#F3F4F6; }
  .btn-primary{ background:var(--brand); color:#fff; border-color:var(--brand); }
  .btn-primary:hover{ background:#123846; }
  .btn-danger{ color:var(--error); border-color:transparent; background:transparent; padding:4px 8px;}
  .btn-danger:hover{ background:var(--error-bg); border-radius:4px; }

  .toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:10px; flex-wrap:wrap;}
  .toolbar-right{ display:flex; gap:8px; }

  .log-form{ display:grid; grid-template-columns:120px 140px 130px 1fr 130px 130px 130px auto; gap:8px; margin-bottom:16px; align-items:end;}
  .log-form label{ font-size:10.5px; color:var(--ink-soft); display:block; margin-bottom:3px; font-weight:600;}
  .log-form input, .log-form select{ border:1px solid var(--line); background:#fff; }

  .empty-state{ text-align:center; padding:36px 20px; color:var(--ink-soft); }
  .empty-state strong{ display:block; color:var(--ink); margin-bottom:4px; font-size:13.5px;}

  .save-note{ font-size:11.5px; color:var(--ink-soft); margin-top:8px; }
  .loading{ padding:40px; text-align:center; color:var(--ink-soft); }

  .legend{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:16px; font-size:11.5px; color:var(--ink-soft);}
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }

  ::-webkit-scrollbar{ height:9px; width:9px; }
  ::-webkit-scrollbar-thumb{ background:#C6CCD4; border-radius:5px; }

  /* Notas (observaciones) */
  .notes-btn{
    position:relative; border:1px solid var(--line); background:#fff; border-radius:6px;
    width:32px; height:28px; cursor:pointer; font-size:14px; display:inline-flex;
    align-items:center; justify-content:center;
  }
  .notes-btn:hover{ background:#F3F4F6; border-color:var(--brand); }
  .notes-dot{ position:absolute; top:-3px; right:-3px; width:8px; height:8px; border-radius:50%; background:var(--prog); border:1.5px solid #fff; }

  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(20,25,32,0.45); z-index:50;
    align-items:center; justify-content:center;
  }
  .modal-overlay.open{ display:flex; }
  .modal-notebook{
    background:#FFFDF7; width:400px; max-width:90vw; border-radius:10px;
    box-shadow:0 14px 44px rgba(0,0,0,0.28); overflow:hidden; border:1px solid var(--line);
  }
  .modal-header{
    display:flex; justify-content:space-between; align-items:center; padding:12px 16px;
    background:var(--brand); color:#fff; font-size:13px; font-weight:600;
  }
  .modal-header span.dim{ font-weight:400; color:rgba(255,255,255,0.7); }
  .modal-close{ background:none; border:none; color:#fff; cursor:pointer; font-size:15px; line-height:1; padding:2px 4px; }
  .modal-close:hover{ opacity:0.7; }
  #notes-textarea{
    width:100%; min-height:230px; border:none; resize:vertical; padding:16px 16px 16px 18px;
    font-family:var(--sans); font-size:13px; line-height:26px; box-sizing:border-box; color:var(--ink);
    background-image:repeating-linear-gradient(to bottom, transparent 0, transparent 25px, var(--line) 26px);
    background-attachment:local;
  }
  #notes-textarea:focus{ outline:none; }
  .modal-footer{
    display:flex; justify-content:flex-end; gap:8px; padding:10px 14px;
    background:#F3F1E8; border-top:1px solid var(--line);
  }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="brand">Subcustodia<small>Seguimiento de pruebas SWIFT · Eventos corporativos</small></div>
    <button class="nav-btn active" data-view="dashboard">Dashboard</button>
    <button class="nav-btn" data-view="matriz">Matriz de pruebas</button>
    <button class="nav-btn" data-view="bitacora">Bitácora diaria</button>
    <div id="conn-status">Conectando…</div>
  </div>
  <div class="main" id="main">
    <div class="loading">Cargando…</div>
  </div>
</div>

<div class="modal-overlay" id="notes-overlay">
  <div class="modal-notebook">
    <div class="modal-header">
      <span>Observaciones <span class="dim">· <span id="notes-modal-id"></span></span></span>
      <button class="modal-close" id="notes-close-x">✕</button>
    </div>
    <textarea id="notes-textarea" placeholder="Escribí acá las correcciones o comentarios, una línea por ítem..."></textarea>
    <div class="modal-footer">
      <button class="btn" id="notes-cancel">Cancelar</button>
      <button class="btn btn-primary" id="notes-save">Guardar</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, addDoc, getDocs, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

/* ======================================================================
   CONFIGURACIÓN DE FIREBASE
   Reemplazá estos valores por los de TU proyecto (ver instrucciones que
   te pasé aparte). Se sacan de: Configuración del proyecto > Tus apps.
   ====================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyDB1dPF7FIqbAcOMGCY5RbbsODXFb8ZJl8",
  authDomain: "tester-subcu.firebaseapp.com",
  projectId: "tester-subcu",
  storageBucket: "tester-subcu.firebasestorage.app",
  messagingSenderId: "71277400225",
  appId: "1:71277400225:web:4d74d3ddbcf830362060e0"
};
/* ====================================================================== */

const EVENT_TYPES = [
  { key: 'interest', label: 'Interest', prefix: 'INT' },
  { key: 'partial_redemption', label: 'Partial Redemption', prefix: 'PR' },
  { key: 'final_maturity', label: 'Final Maturity', prefix: 'FM' },
  { key: 'full_call', label: 'Full Call / Early Redemption', prefix: 'FC' },
  { key: 'cash_dividend', label: 'Cash Dividend', prefix: 'CD' },
];
const MONEDAS = ['USD Local', 'Pesos (ARS)', 'USD Exterior'];
const EMISORES = ['Común', 'ARGE', 'BCRA'];
const STATUS_OPTS = ['Pendiente', 'OK', 'Error Mensaje', 'Error Sistema'];
const MSG_COLS = [
  { key: 'mt564Notif', label: 'MT564 Notificación' },
  { key: 'mt564Preaviso', label: 'MT564 Preaviso' },
  { key: 'mt566Confirm', label: 'MT566 Confirmación' },
];

let state = { testCases: [], dailyLog: [] };
let currentView = 'dashboard';
let currentEventTab = 'interest';
let db = null;

function todayStr(){ return new Date().toISOString().slice(0,10); }
function nowStr(){
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function statusClass(s){ return 'st-' + s.replace(/\s+/g,''); }
function addDays(n){ const d = new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }

function seedData(){
  const base = [
    ['Especie A · Bono Común Ley Arg', 'USD Local', 'Común', addDays(1)],
    ['Especie B · Bono Común Pesos', 'Pesos (ARS)', 'Común', addDays(30)],
    ['Especie C · Título ARGE USD Ext.', 'USD Exterior', 'ARGE', addDays(35)],
    ['Especie D · Instrumento BCRA Pesos', 'Pesos (ARS)', 'BCRA', addDays(2)],
    ['Especie A · Bono Común Ley Arg', 'USD Local', 'Común', addDays(40)],
    ['Especie E · Título BCRA USD Ext.', 'USD Exterior', 'BCRA', addDays(1)],
    ['Especie A · Bono Común Ley Arg', 'USD Local', 'Común', addDays(40)],
    ['Especie B · Bono Común Pesos', 'Pesos (ARS)', 'Común', addDays(30)],
    ['Especie C · Título ARGE USD Ext.', 'USD Exterior', 'ARGE', addDays(35)],
    ['Especie D · Instrumento BCRA Pesos', 'Pesos (ARS)', 'BCRA', addDays(2)],
    ['Especie A · Bono Común Ley Arg', 'USD Local', 'Común', addDays(40)],
    ['Especie E · Título BCRA USD Ext.', 'USD Exterior', 'BCRA', addDays(1)],
  ];
  return base.map((row, i) => ({
    id: 'INT-' + String(i+1).padStart(2,'0'),
    csd: '',
    eventType: 'interest',
    especie: row[0], moneda: row[1], emisor: row[2],
    fecha: row[3],
    mt564Notif: 'Pendiente', mt564Preaviso: 'Pendiente', mt566Confirm: 'Pendiente',
    resultado: 'Pendiente', observaciones: '', responsable: '', actualizado: nowStr(),
  }));
}

/* ---------------- Conexión a Firebase ---------------- */

function configIsPlaceholder(){
  return !firebaseConfig.apiKey || firebaseConfig.apiKey.indexOf('TU_') === 0;
}

function setConnStatus(text, ok){
  const el = document.getElementById('conn-status');
  if(el) el.textContent = text;
}

function showSetupScreen(){
  document.querySelector('.sidebar').style.display = 'none';
  document.getElementById('main').innerHTML = `
    <div class="panel" style="max-width:640px;margin:60px auto;">
      <h3>Falta conectar la base de datos</h3>
      <p style="color:var(--ink-soft);font-size:13px;line-height:1.7;">
        Este archivo está listo, pero le falta la configuración de tu proyecto de Firebase (gratis) para poder
        guardar los datos. Abrí el archivo .html en un editor de texto, buscá el bloque
        <code>firebaseConfig</code> cerca del principio del &lt;script&gt;, y reemplazá los valores
        <code>"TU_API_KEY"</code>, <code>"TU_PROYECTO"</code>, etc. por los de tu proyecto.
      </p>
      <p style="color:var(--ink-soft);font-size:13px;line-height:1.7;">
        Esos datos se obtienen en la consola de Firebase: Configuración del proyecto (ícono de engranaje) →
        "Tus apps" → app web → objeto <code>firebaseConfig</code>.
      </p>
    </div>`;
}

function showConnError(message){
  document.getElementById('main').innerHTML = `
    <div class="panel" style="max-width:640px;margin:60px auto;">
      <h3>No se pudo conectar con la base de datos</h3>
      <p style="color:var(--ink-soft);font-size:13px;line-height:1.7;">
        Revisá que el proyecto de Firebase exista, que la autenticación anónima esté habilitada y que las
        reglas de seguridad de Firestore permitan leer/escribir a usuarios autenticados.
      </p>
      <p style="color:var(--error);font-size:12px;font-family:var(--mono);">${message}</p>
    </div>`;
  setConnStatus('🔴 Sin conexión');
}

async function initFirebase(){
  if(configIsPlaceholder()){ showSetupScreen(); return; }
  try{
    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);
    const auth = getAuth(app);

    await new Promise((resolve, reject) => {
      const unsub = onAuthStateChanged(auth, (user) => {
        if(user){ unsub(); resolve(); }
      }, reject);
      signInAnonymously(auth).catch(reject);
    });

    await seedIfEmpty();
    subscribeToTestCases();
    subscribeToDailyLog();
    setConnStatus('🟢 Conectado');
  }catch(e){
    console.error(e);
    showConnError(e.message || String(e));
  }
}

async function seedIfEmpty(){
  const snap = await getDocs(collection(db, 'testcases'));
  if(snap.empty){
    const seed = seedData();
    for(const row of seed){
      const { id, ...data } = row;
      await setDoc(doc(db, 'testcases', id), data);
    }
  }
}

function subscribeToTestCases(){
  onSnapshot(collection(db, 'testcases'), (snap) => {
    state.testCases = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, (err) => { console.error('Error leyendo casos', err); setConnStatus('🔴 Error de lectura'); });
}
function subscribeToDailyLog(){
  onSnapshot(collection(db, 'dailylog'), (snap) => {
    state.dailyLog = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, (err) => { console.error('Error leyendo bitácora', err); });
}

/* ---------------- Render ---------------- */

function render(){
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === currentView));
  const main = document.getElementById('main');
  if(currentView === 'dashboard') main.innerHTML = renderDashboard();
  else if(currentView === 'matriz') main.innerHTML = renderMatriz();
  else main.innerHTML = renderBitacora();
  attachHandlers();
}

function renderDashboard(){
  const tc = state.testCases;
  const counts = { Pendiente:0, OK:0, 'Error Mensaje':0, 'Error Sistema':0 };
  tc.forEach(r => { if(counts[r.resultado] !== undefined) counts[r.resultado]++; });
  const total = tc.length;

  const perEvent = EVENT_TYPES.map(ev => {
    const rows = tc.filter(r => r.eventType === ev.key);
    const ok = rows.filter(r => r.resultado === 'OK').length;
    const errMsg = rows.filter(r => r.resultado === 'Error Mensaje').length;
    const errSis = rows.filter(r => r.resultado === 'Error Sistema').length;
    const pct = rows.length ? Math.round((ok/rows.length)*100) : 0;
    return { ev, rows, ok, errMsg, errSis, pct };
  });

  const recentLog = [...state.dailyLog].sort((a,b)=> (b.fecha||'').localeCompare(a.fecha||'')).slice(0,6);

  return `
    <h1 class="page-title">Dashboard de avance</h1>
    <p class="page-sub">Estado general de las pruebas de mensajería SWIFT (MT564 / MT566) por tipo de evento corporativo.</p>

    <div class="cards-row">
      <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">Casos totales</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--ok)">${counts.OK}</div><div class="stat-label">OK</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--pend)">${counts.Pendiente}</div><div class="stat-label">Pendiente</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--error)">${counts['Error Mensaje']}</div><div class="stat-label">Error Mensaje</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--prog)">${counts['Error Sistema']}</div><div class="stat-label">Error Sistema</div></div>
    </div>

    <div class="panel">
      <h3>Avance por tipo de evento</h3>
      ${perEvent.map(p => `
        <div class="progress-row">
          <div class="progress-label">${p.ev.label} <span style="color:var(--ink-soft)">(${p.rows.length} casos)</span></div>
          <div class="progress-track">
            <div class="progress-fill" style="width:${p.rows.length ? (p.ok/p.rows.length*100) : 0}%; background:var(--ok)"></div>
            <div class="progress-fill" style="width:${p.rows.length ? (p.errMsg/p.rows.length*100) : 0}%; background:var(--error)"></div>
            <div class="progress-fill" style="width:${p.rows.length ? (p.errSis/p.rows.length*100) : 0}%; background:var(--prog)"></div>
          </div>
          <div class="progress-pct">${p.pct}% OK</div>
        </div>
      `).join('')}
      <div class="legend">
        <span><span class="dot" style="background:var(--ok)"></span> OK</span>
        <span><span class="dot" style="background:var(--error)"></span> Error Mensaje</span>
        <span><span class="dot" style="background:var(--prog)"></span> Error Sistema</span>
        <span><span class="dot" style="background:var(--pend)"></span> Pendiente / sin iniciar</span>
      </div>
    </div>

    <div class="panel">
      <h3>Últimos movimientos en la bitácora</h3>
      ${recentLog.length === 0 ? '<div class="empty-state">Todavía no se cargaron cambios ni errores en la bitácora.</div>' :
        `<div class="table-wrap"><table style="min-width:0"><thead><tr>
          <th>Fecha</th><th>Caso</th><th>Tipo</th><th>Detalle</th><th>Responsable</th>
        </tr></thead><tbody>
        ${recentLog.map(l => `<tr>
          <td style="font-family:var(--mono)">${l.fecha||''}</td>
          <td style="font-family:var(--mono);font-weight:700">${csdLabel(l.tcId)}</td>
          <td>${l.tipo||''}</td>
          <td>${(l.detalle||'').replace(/</g,'&lt;')}</td>
          <td>${l.responsable||''}</td>
        </tr>`).join('')}
        </tbody></table></div>`
      }
    </div>
  `;
}

function renderMatriz(){
  const rows = state.testCases.filter(r => r.eventType === currentEventTab);
  return `
    <h1 class="page-title">Matriz de pruebas</h1>
    <p class="page-sub">Editá cualquier celda directamente. Los cambios se guardan y quedan visibles para todo el equipo en tiempo real.</p>
    <div class="event-tabs">
      ${EVENT_TYPES.map(ev => `<button class="event-tab ${ev.key===currentEventTab?'active':''}" data-ev="${ev.key}">${ev.label}</button>`).join('')}
    </div>
    <div class="toolbar">
      <div class="save-note">${rows.length} caso(s) cargado(s) para ${EVENT_TYPES.find(e=>e.key===currentEventTab).label}</div>
      <div class="toolbar-right">
        <button class="btn btn-primary" id="add-row-btn">+ Agregar caso</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th class="id-col">CSD</th>
          <th>Especie</th>
          <th>Moneda</th>
          <th>Emisor</th>
          <th>Fecha de pago</th>
          ${MSG_COLS.map(c => `<th>${c.label}</th>`).join('')}
          <th>Resultado general</th>
          <th>Observaciones</th>
          <th>Responsable</th>
          <th>Actualizado</th>
          <th></th>
        </tr></thead>
        <tbody>
          ${rows.length === 0 ? `<tr><td colspan="13"><div class="empty-state"><strong>Sin casos cargados todavía</strong>Agregá el primer caso de prueba para este tipo de evento.</div></td></tr>` :
          rows.map(r => renderRow(r)).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderRow(r){
  const isImmediate = (new Date(r.fecha) - new Date(todayStr())) <= (3*24*3600*1000);
  const dateBadge = isImmediate ? `<span class="badge badge-inmediato">Inmediato</span>` : `<span class="badge badge-futuro">Futuro</span>`;
  return `
    <tr data-id="${r.id}">
      <td class="id-col"><input type="text" data-field="csd" value="${escAttr(r.csd)}" placeholder="Código CSD" style="min-width:100px"></td>
      <td><input type="text" data-field="especie" value="${escAttr(r.especie)}"></td>
      <td>${select('moneda', MONEDAS, r.moneda)}</td>
      <td>${select('emisor', EMISORES, r.emisor)}</td>
      <td>
        <input type="date" data-field="fecha" value="${r.fecha}" style="width:130px;display:inline-block">
        ${dateBadge}
      </td>
      ${MSG_COLS.map(c => `<td>${statusSelect(c.key, r[c.key])}</td>`).join('')}
      <td>${statusSelect('resultado', r.resultado)}</td>
      <td style="text-align:center">
        <button class="notes-btn" data-notes="${r.id}" title="Ver / escribir observaciones">📝${r.observaciones ? '<span class="notes-dot"></span>' : ''}</button>
      </td>
      <td><input type="text" data-field="responsable" value="${escAttr(r.responsable)}" placeholder="—"></td>
      <td style="font-family:var(--mono);color:var(--ink-soft);white-space:nowrap;">${r.actualizado}</td>
      <td><button class="btn-danger" data-del="${r.id}" title="Eliminar caso">✕</button></td>
    </tr>
  `;
}

function select(field, opts, val){
  return `<select data-field="${field}">${opts.map(o => `<option value="${escAttr(o)}" ${o===val?'selected':''}>${o}</option>`).join('')}</select>`;
}
function statusSelect(field, val){
  return `<select class="status-select ${statusClass(val)}" data-field="${field}">
    ${STATUS_OPTS.map(o => `<option value="${o}" ${o===val?'selected':''}>${o}</option>`).join('')}
  </select>`;
}
function escAttr(s){ return (s||'').replace(/"/g,'&quot;'); }
function csdLabel(tcId){
  const row = state.testCases.find(r => r.id === tcId);
  if(!row) return tcId || '—';
  return row.csd || row.id;
}

function renderBitacora(){
  const allIds = state.testCases.map(r => ({ value: r.id, label: (r.csd ? r.csd + ' · ' : '') + r.id }));
  const sorted = [...state.dailyLog].sort((a,b)=> (b.fecha||'').localeCompare(a.fecha||''));
  return `
    <h1 class="page-title">Bitácora diaria</h1>
    <p class="page-sub">Registrá cada cambio o error detectado día a día, asociado al caso de la matriz.</p>

    <div class="panel">
      <h3>Nuevo registro</h3>
      <div class="log-form">
        <div><label>Fecha</label><input type="date" id="log-fecha" value="${todayStr()}"></div>
        <div><label>Caso (CSD)</label><select id="log-tcid"><option value="">—</option>${allIds.map(o=>`<option value="${o.value}">${o.label}</option>`).join('')}</select></div>
        <div><label>Tipo</label><select id="log-tipo"><option>Cambio</option><option>Error</option></select></div>
        <div><label>Detalle</label><input type="text" id="log-detalle" placeholder="Qué pasó..."></div>
        <div><label>Estado anterior</label><select id="log-antes"><option value="">—</option>${STATUS_OPTS.map(s=>`<option>${s}</option>`).join('')}</select></div>
        <div><label>Estado nuevo</label><select id="log-despues"><option value="">—</option>${STATUS_OPTS.map(s=>`<option>${s}</option>`).join('')}</select></div>
        <div><label>Responsable</label><input type="text" id="log-resp" placeholder="Nombre"></div>
        <div><button class="btn btn-primary" id="log-add-btn">Agregar</button></div>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Fecha</th><th>Caso</th><th>Tipo</th><th>Detalle</th><th>Estado ant.</th><th>Estado nuevo</th><th>Responsable</th><th></th>
        </tr></thead>
        <tbody>
        ${sorted.length === 0 ? `<tr><td colspan="8"><div class="empty-state"><strong>Todavía no hay registros</strong>Cargá el primer cambio o error del día.</div></td></tr>` :
          sorted.map(l => `<tr data-logid="${l.id}">
            <td style="font-family:var(--mono)">${l.fecha}</td>
            <td style="font-family:var(--mono);font-weight:700">${csdLabel(l.tcId)}</td>
            <td>${l.tipo==='Error' ? `<span class="badge" style="background:var(--error-bg);color:var(--error)">Error</span>` : `<span class="badge" style="background:var(--prog-bg);color:var(--prog)">Cambio</span>`}</td>
            <td>${(l.detalle||'').replace(/</g,'&lt;')}</td>
            <td>${l.antes||'—'}</td>
            <td>${l.despues||'—'}</td>
            <td>${l.responsable||'—'}</td>
            <td><button class="btn-danger" data-dellog="${l.id}">✕</button></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

/* ---------------- Handlers y escritura a Firestore ---------------- */

function attachHandlers(){
  document.querySelectorAll('.event-tab').forEach(b => b.onclick = () => { currentEventTab = b.dataset.ev; render(); });
  const addBtn = document.getElementById('add-row-btn');
  if(addBtn) addBtn.onclick = addTestCase;

  document.querySelectorAll('tbody tr[data-id]').forEach(tr => {
    const id = tr.dataset.id;
    tr.querySelectorAll('[data-field]').forEach(input => {
      input.addEventListener('change', () => updateField(id, input.dataset.field, input.value));
    });
  });
  document.querySelectorAll('[data-del]').forEach(btn => btn.onclick = () => deleteTestCase(btn.dataset.del));
  document.querySelectorAll('[data-notes]').forEach(btn => btn.onclick = () => openNotes(btn.dataset.notes));

  const logAdd = document.getElementById('log-add-btn');
  if(logAdd) logAdd.onclick = addLogEntry;
  document.querySelectorAll('[data-dellog]').forEach(btn => btn.onclick = () => deleteLogEntry(btn.dataset.dellog));
}

async function updateField(id, field, value){
  try{
    await updateDoc(doc(db, 'testcases', id), { [field]: value, actualizado: nowStr() });
  }catch(e){ console.error(e); alert('No se pudo guardar el cambio. Revisá tu conexión.'); }
}

async function addTestCase(){
  const ev = EVENT_TYPES.find(e => e.key === currentEventTab);
  const newRow = {
    csd: '', eventType: ev.key, especie: '', moneda: MONEDAS[0], emisor: EMISORES[0],
    fecha: todayStr(),
    mt564Notif: 'Pendiente', mt564Preaviso: 'Pendiente', mt566Confirm: 'Pendiente',
    resultado: 'Pendiente', observaciones: '', responsable: '', actualizado: nowStr(),
  };
  try{ await addDoc(collection(db, 'testcases'), newRow); }
  catch(e){ console.error(e); alert('No se pudo crear el caso.'); }
}

async function deleteTestCase(id){
  if(!confirm('¿Eliminar el caso ' + id + '? Esta acción no se puede deshacer.')) return;
  try{ await deleteDoc(doc(db, 'testcases', id)); }
  catch(e){ console.error(e); alert('No se pudo eliminar el caso.'); }
}

async function addLogEntry(){
  const detalle = document.getElementById('log-detalle').value.trim();
  if(!detalle){ alert('Cargá un detalle para el registro.'); return; }
  const entry = {
    fecha: document.getElementById('log-fecha').value || todayStr(),
    tcId: document.getElementById('log-tcid').value,
    tipo: document.getElementById('log-tipo').value,
    detalle,
    antes: document.getElementById('log-antes').value,
    despues: document.getElementById('log-despues').value,
    responsable: document.getElementById('log-resp').value.trim(),
  };
  try{ await addDoc(collection(db, 'dailylog'), entry); }
  catch(e){ console.error(e); alert('No se pudo guardar el registro.'); }
}

async function deleteLogEntry(id){
  try{ await deleteDoc(doc(db, 'dailylog', id)); }
  catch(e){ console.error(e); alert('No se pudo eliminar el registro.'); }
}

let currentNotesId = null;
function openNotes(id){
  const row = state.testCases.find(r => r.id === id);
  if(!row) return;
  currentNotesId = id;
  document.getElementById('notes-modal-id').textContent = row.csd || row.id;
  document.getElementById('notes-textarea').value = row.observaciones || '';
  document.getElementById('notes-overlay').classList.add('open');
  setTimeout(() => document.getElementById('notes-textarea').focus(), 0);
}
function closeNotes(){
  document.getElementById('notes-overlay').classList.remove('open');
  currentNotesId = null;
}
async function saveNotesModal(){
  if(!currentNotesId) return;
  try{
    await updateDoc(doc(db, 'testcases', currentNotesId), {
      observaciones: document.getElementById('notes-textarea').value,
      actualizado: nowStr(),
    });
  }catch(e){ console.error(e); alert('No se pudo guardar la nota.'); }
  closeNotes();
}
document.getElementById('notes-close-x').onclick = closeNotes;
document.getElementById('notes-cancel').onclick = closeNotes;
document.getElementById('notes-save').onclick = saveNotesModal;
document.getElementById('notes-overlay').addEventListener('click', (e) => {
  if(e.target.id === 'notes-overlay') closeNotes();
});

document.querySelectorAll('.nav-btn').forEach(b => b.onclick = () => { currentView = b.dataset.view; render(); });

initFirebase();
</script>
</body>
</html>
